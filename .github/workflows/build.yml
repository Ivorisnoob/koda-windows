name: build

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src\Koda\Koda.csproj -p:Platform=x64 --configuration Release

      - name: Test
        run: dotnet test tests\Koda.Core.Tests --configuration Release
